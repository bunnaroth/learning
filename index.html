<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Netflix</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./css/custom.css">
    </head>
    <body class="bg-gray-950 min-h-screen flex flex-col">

        <!-- Navbar -->
        <nav class="navbar-gradient text-white px-6 py-4 shadow-2xl sticky top-0 z-50 border-b border-transparent hover:border-red-500/20 transition-all">
            <div class="container mx-auto flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="logo-container">
                        <span class="text-4xl font-black logo-text">▶</span>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold navbar-title">CINEMA</h1>
                        <p class="text-xs text-gray-400 -mt-1">Discover Movies</p>
                    </div>
                </div>

                <button id="darkToggle" class="relative group">
                    <span class="text-2xl group-hover:scale-125 transition-transform duration-300 inline-block">🌙</span>
                    <div class="absolute -bottom-8 right-0 bg-gray-800 text-white text-xs px-3 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">Dark Mode</div>
                </button>
            </div>
        </nav>

        <!-- Hero Section -->
        <section class="bg-gradient-to-b from-gray-900 to-gray-950 text-white py-16 text-center">
            <h2 class="text-5xl font-black mb-6 tracking-wide">Discover Your Favorites Movies</h2>
            <input type="text" id="searchInput" placeholder="🔍 Search movies..." class="w-3/4 md:w-1/2 px-5 py-4 rounded-lg text-gray-900 bg-gray-100 focus:outline-none focus:ring-2 focus:ring-red-600 transition-all shadow-lg font-semibold">
        </section>

        <!-- Genre Filter Section -->
        <section class="container mx-auto py-8 px-4">
            <h3 class="text-gray-400 text-sm uppercase tracking-widest font-bold mb-5 text-center">Filter by Genre</h3>
            <div id="genreFilters" class="flex flex-wrap gap-4 justify-center">

            </div>
        </section>

        <!-- Movie Grid Section -->
        <section class="container mx-auto px-4 pb-10">
            <div id="movieGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </section>

        <!-- Movie Modal -->
        <div id="movieModal" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center p-4 z-50 modal-backdrop">
            <div class="bg-gray-900 w-full max-w-2xl rounded-xl p-8 relative shadow-2xl border border-gray-700 modal-content">
                <button id="closeModal" class="close-modal-btn absolute top-4 right-4 w-10 h-10 flex items-center justify-center rounded-full bg-red-600/20 hover:bg-red-600 hover:text-white transition-all duration-300 group border border-red-500">
                    <span class="text-xl font-bold group-hover:scale-125 transition-transform">✕</span>
                </button>
                
                <div id="modalContent">
                    <!-- Movie details will be injected here -->
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="bg-gray-950 border-t border-gray-800 text-gray-400 text-center p-6 mt-auto">
            <p class="text-sm uppercase tracking-widest">© 2026 Netflix. All Rights Reserved.</p>
        </footer>

        <!-- JS files -->
        <script src="./js/data.js"></script>
        <script src="./js/storage.js"></script>
        <script src="./js/ui.js"></script>
        <script src="./js/events.js"></script>
        <script src="./js/app.js"></script>
    </body>
</html>
